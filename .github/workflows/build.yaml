name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

  release:
    name: Release Plugin Bundles
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_suffix: linux_x86_64
          - goos: linux
            goarch: arm64
            asset_suffix: linux_arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          dist_dir="dist/omarchy-sonos_${VERSION}_${ASSET_SUFFIX}"
          archive_path="${dist_dir}.tar.gz"

          make build
          ./scripts/stage-plugin.sh "$dist_dir"
          cp -R docs "$dist_dir/"

          tar -C dist -czf "$archive_path" "omarchy-sonos_${VERSION}_${ASSET_SUFFIX}"
          sha256sum "$archive_path" > "$archive_path.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: omarchy-sonos_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}
          path: |
            dist/omarchy-sonos_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}.tar.gz
            dist/omarchy-sonos_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}.tar.gz.sha256

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/omarchy-sonos_${{ github.ref_name }}_${{ matrix.asset_suffix }}.tar.gz
            dist/omarchy-sonos_${{ github.ref_name }}_${{ matrix.asset_suffix }}.tar.gz.sha256
