name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Summarize coverage
        run: go tool cover -func=coverage.out -o=coverage-summary.out

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.out
          if-no-files-found: error

  coverage-badge:
    name: Update Coverage Badge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: coverage-badge-main
      cancel-in-progress: false

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check coverage is current
        id: current
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.current.outputs.update == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Download coverage reports
        if: steps.current.outputs.update == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Update coverage badge
        if: steps.current.outputs.update == 'true'
        uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05 # v3
        with:
          filename: coverage-summary.out
          link: https://github.com/sgruendel/omarchy-sonos/actions/workflows/build.yaml

      - name: Save coverage badge
        if: steps.current.outputs.update == 'true'
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: update coverage badge'
          git push origin HEAD:main

  release:
    name: Release Plugin Bundles
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_suffix: linux_x86_64
          - goos: linux
            goarch: arm64
            asset_suffix: linux_arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          dist_dir="dist/omarchy-sonos_${VERSION}_${ASSET_SUFFIX}"
          archive_path="${dist_dir}.tar.gz"

          make build
          ./scripts/stage-plugin.sh "$dist_dir"
          cp -R docs "$dist_dir/"

          tar -C dist -czf "$archive_path" "omarchy-sonos_${VERSION}_${ASSET_SUFFIX}"
          sha256sum "$archive_path" > "$archive_path.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: omarchy-sonos_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}
          path: |
            dist/omarchy-sonos_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}.tar.gz
            dist/omarchy-sonos_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}.tar.gz.sha256

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/omarchy-sonos_${{ github.ref_name }}_${{ matrix.asset_suffix }}.tar.gz
            dist/omarchy-sonos_${{ github.ref_name }}_${{ matrix.asset_suffix }}.tar.gz.sha256
